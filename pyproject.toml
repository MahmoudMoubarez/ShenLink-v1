[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "multiflow-v1"
version = "0.1.0rc1"
description = "Multipath adaptive video, ordered commands and latest sensor readings"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pillow>=9"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["multiflow_comm*", "video_stream*"]
